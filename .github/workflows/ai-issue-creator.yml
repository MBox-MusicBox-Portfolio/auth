name: AI Code Analysis & Issue Creator

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-and-create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Analysis
        uses: originalorange/gpt-action@v2
        with:
          openai-api-key: ${{ secrets.CHATGPT_KEY }}
          openai-model: 'gpt-4o'
          prompt: |
            Проанализируй файлы в этом репозитории . Найди критические уязвимости, архитектурные проблемы или места, требующие рефакторинга.
            Сформулируй ОДНУ самую важную проблему. Ответь строго в формате JSON:
            {
              "title": "Заголовок проблемы для Issue",
              "body": "Подробное описание проблемы, где она находится и как её исправить."
            }
            
      - name: Create GitHub Issue
        run: |
          TITLE=$(cat gpt-output.json | jq -r '.title')
          BODY=$(cat gpt-output.json | jq -r '.body')
          gh issue create --title "$TITLE" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}