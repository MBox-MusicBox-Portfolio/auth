- name: Run AI Analysis
  run: |
    CODE_TEXT=$(jq -Rs . codebase.txt)
    PAYLOAD=$(jq -n \
      --arg prompt "Проанализируй файлы в этом репозитории. Найди критические уязвимости, архитектурные проблемы или места, требующие рефакторинга. Сформулируй ОДНУ самую важную проблему. Ответь строго в формате JSON без markdown: {\"title\":\"Заголовок\",\"body\":\"Описание проблемы и исправление\"}" \
      --arg code "$CODE_TEXT" \
      '{
        model: "gpt-4o",
        response_format: {
          type: "json_object"
        },
        messages: [
          {
            role: "system",
            content: $prompt
          },
          {
            role: "user",
            content: $code
          }
        ]
      }')

    RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer ${{ secrets.CHATGPT_KEY }}" \
      -d "$PAYLOAD")

    echo "$RESPONSE" \
      | jq -r '.choices[0].message.content' \
      | jq . > gpt-output.json
