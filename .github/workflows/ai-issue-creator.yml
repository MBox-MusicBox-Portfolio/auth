name: AI Code Analysis & Issue Creator

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-and-create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Code Context
        run: |
          echo "=== CODEBASE ANALYSIS ===" > codebase.txt
          find . -type f \( -name "*.js" -o -name "*.ts" -o -name "*.py" -o -name "*.json" -o -name "*.cpp" -o -name "*.cs" \) -not -path "*/node_modules/*" -not -path "*/.git/*" | while read file; do
            echo "--- File: $file ---" >> codebase.txt
            cat "$file" >> codebase.txt
            echo -e "\n" >> codebase.txt
          done

      - name: Run AI Analysis
        run: |
          CODE_TEXT=$(cat codebase.txt | jq -sR .)
          
          PAYLOAD=$(jq -n \
            --arg prompt "Проанализируй файлы в этом репозитории. Найди критические уязвимости, архитектурные проблемы или места, требующие рефакторинга. Сформулируй ОДНУ самую важную проблему. Ответь строго в формате JSON без markdown разметки: {\"title\": \"Заголовок проблемы для Issue\", \"body\": \"Подробное описание проблемы, где она находится и как её исправить.\"}" \
            --arg code "$CODE_TEXT" \
            '{
              model: "gpt-4o",
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: $prompt },
                { role: "user", content: $code }
              ]
            }')
            
          RESPONSE=$(curl -s https://openai.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CHATGPT_KEY }}" \
            -d "$PAYLOAD")
            
          echo "$RESPONSE" | jq -r '.choices.message.content' > gpt-output.json

      - name: Create GitHub Issue
        run: |
          TITLE=$(cat gpt-output.json | jq -r '.title')
          BODY=$(cat gpt-output.json | jq -r '.body')
          
          if [ "$TITLE" != "null" ] && [ -n "$TITLE" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Ошибка: ИИ вернул некорректный ответ или API-ключ не подошел."
            cat gpt-output.json
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
